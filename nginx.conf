server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # --- Same-origin Firebase Auth (bulletproof iOS Safari sign-in) ---
    # Transparently proxy Firebase's sign-in helper from THIS domain to the
    # Firebase auth domain. With authDomain pointed here (see lib/firebase.ts on
    # iOS), the whole OAuth handshake is same-origin, so Safari's tracking
    # prevention can't partition the storage the handshake needs.
    location /__/auth {
        proxy_pass https://gen-lang-client-0384516171.firebaseapp.com;
        proxy_ssl_server_name on;
        proxy_set_header Host gen-lang-client-0384516171.firebaseapp.com;
    }
    location /__/firebase {
        proxy_pass https://gen-lang-client-0384516171.firebaseapp.com;
        proxy_ssl_server_name on;
        proxy_set_header Host gen-lang-client-0384516171.firebaseapp.com;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
