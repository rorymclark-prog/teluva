<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teluva — everything you love, kept together</title>
    <meta name="description" content="Teluva keeps your family's sizes, documents, medical notes and plans together in one private place." />
    <!-- PWA: installable so iOS/Android can deliver Web Push notifications.
         manifest + icons resolve from dist root (Vite copies public/* there). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Browser tab icon. Without these the browser silently requests /favicon.ico
         and shows a blank page glyph — which is what it did until the brand kit
         arrived. .ico first for old Windows browsers, PNG for everything modern. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#EA5A3B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Teluva" />
    <!-- Text size, applied before the first paint. It has to run here rather
         than in React: the app's own bundle loads after the first frame, so a
         reader on the largest size would otherwise watch the whole screen
         resize a moment after it appeared. Kept in lockstep with the steps in
         src/utils/textScale.ts. -->
    <script>
      try {
        // Read as a string and bail on a missing key: Number(null) is 0, which
        // is a VALID index, so the shortcut would hand every first-time reader
        // the smallest size instead of the default.
        var i = localStorage.getItem('teluva.textScale');
        var s = i === null ? null : [0.9, 1, 1.1, 1.2, 1.35][Number(i)];
        if (s) {
          // Root font size scales Tailwind's rem-based icons and spacing; the
          // variable scales the app's hardcoded px text. Both, or the interface
          // grows while the words stay put. Mirrors src/utils/textScale.ts.
          document.documentElement.style.fontSize = 16 * s + 'px';
          document.documentElement.style.setProperty('--type-user', String(s));
        }
      } catch (e) { /* private mode — ship the default size */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
