apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: family-info-organizer
  namespace: '1000796646145'
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: 'true'
    run.googleapis.com/maxScale: '1'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '3'
        autoscaling.knative.dev/minScale: '0'
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      containerConcurrency: 80
      containers:
      - image: europe-west2-docker.pkg.dev/gen-lang-client-0384516171/cloud-run-source-deploy/family-info-organizer:v24
        name: app-container
        ports:
        - containerPort: 8080
          name: http1
        env:
        # Gemini key comes from Secret Manager — never stored in this file or git.
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: latest
        - name: FIREBASE_PROJECT_ID
          value: gen-lang-client-0384516171
        - name: ALLOWED_EMAILS
          value: rorymclark@gmail.com,partner@example.com,child@example.com
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
      serviceAccountName: 1000796646145-compute@developer.gserviceaccount.com
      timeoutSeconds: 300
  traffic:
  - latestRevision: true
    percent: 100
