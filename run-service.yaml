apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: teluva
  namespace: '1000796646145'
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: 'true'
    run.googleapis.com/maxScale: '1'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '3'
        autoscaling.knative.dev/minScale: '0'
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      containerConcurrency: 80
      containers:
      - image: europe-west2-docker.pkg.dev/gen-lang-client-0384516171/cloud-run-source-deploy/teluva:v359
        name: app-container
        ports:
        - containerPort: 8080
          name: http1
        env:
        # Gemini key comes from Secret Manager — never stored in this file or git.
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: latest
        # Symmetric key for encrypting the passwords/secrets vault at the app layer.
        - name: VAULT_ENC_KEY
          valueFrom:
            secretKeyRef:
              name: vault-encryption-key
              key: latest
        - name: FIREBASE_PROJECT_ID
          value: gen-lang-client-0384516171
        # Explicit, not the server.js hardcoded fallback — that fallback pointed at
        # a free-tier-limited AI-Studio dev database by accident (2026-08-17 outage,
        # see .claude-context). teluva-prod is a deliberately provisioned, non-free
        # database with no daily read-quota cap.
        - name: FIRESTORE_DB_ID
          value: teluva-prod
        # The two document-reader scope flags. Both default OFF in code, so
        # these lines are what actually opens them — deleting either restores
        # the original refusal without touching a source file.
        # Insurance: was blocked pending an Austrian Rechtsanwalt on GewO §137
        # (Versicherungsvermittlung). Opened 2026-08-30 at the owner's
        # instruction; the reader still only quotes and never advises.
        - name: FEATURE_INSURANCE_READER
          value: "1"
        # Medical/Health: was blocked on Art. 9 GDPR and self-diagnosis grounds.
        # The prohibition on INTERPRETING a result is unchanged and applies
        # whatever this is set to — what opened is quoting, not advice.
        - name: FEATURE_MEDICAL_READER
          value: "1"
        # (ALLOWED_EMAILS removed 2026-08-20: a hardcoded sign-in allowlist left
        # over from before the custom-claim membership model. Nothing in the
        # codebase read it — access is decided by the familyId/familyIds claims
        # the server mints — so it was a live list of household addresses doing
        # no work.)
        # Web Push (birthday/anniversary phone notifications). Public key is not
        # secret — it's shipped to every browser to subscribe. Private key + the
        # cron shared-secret come from Secret Manager.
        - name: VAPID_PUBLIC_KEY
          value: BDPuPXk1dA6RTlCBpjLU0sFvu3GpYRZg3kJffShpnBOdj6j9STCRLmb2nJrUR6RbcM0k-chUcPM2LuG0PUVaRWY
        - name: VAPID_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: vapid-private-key
              key: latest
        - name: CRON_SECRET
          valueFrom:
            secretKeyRef:
              name: cron-secret
              key: latest
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
      serviceAccountName: 1000796646145-compute@developer.gserviceaccount.com
      timeoutSeconds: 300
  traffic:
  - latestRevision: true
    percent: 100
