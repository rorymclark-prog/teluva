apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: family-info-organizer
  namespace: '1000796646145'
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: 'true'
    run.googleapis.com/maxScale: '1'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '3'
        autoscaling.knative.dev/minScale: '0'
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      containerConcurrency: 80
      containers:
      - image: europe-west2-docker.pkg.dev/gen-lang-client-0384516171/cloud-run-source-deploy/family-info-organizer:v123
        name: app-container
        ports:
        - containerPort: 8080
          name: http1
        env:
        # Gemini key comes from Secret Manager — never stored in this file or git.
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: latest
        # Symmetric key for encrypting the passwords/secrets vault at the app layer.
        - name: VAULT_ENC_KEY
          valueFrom:
            secretKeyRef:
              name: vault-encryption-key
              key: latest
        - name: FIREBASE_PROJECT_ID
          value: gen-lang-client-0384516171
        - name: ALLOWED_EMAILS
          value: rorymclark@gmail.com,partner@example.com,child@example.com
        # Web Push (birthday/anniversary phone notifications). Public key is not
        # secret — it's shipped to every browser to subscribe. Private key + the
        # cron shared-secret come from Secret Manager.
        - name: VAPID_PUBLIC_KEY
          value: BDPuPXk1dA6RTlCBpjLU0sFvu3GpYRZg3kJffShpnBOdj6j9STCRLmb2nJrUR6RbcM0k-chUcPM2LuG0PUVaRWY
        - name: VAPID_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: vapid-private-key
              key: latest
        - name: CRON_SECRET
          valueFrom:
            secretKeyRef:
              name: cron-secret
              key: latest
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
      serviceAccountName: 1000796646145-compute@developer.gserviceaccount.com
      timeoutSeconds: 300
  traffic:
  - latestRevision: true
    percent: 100
